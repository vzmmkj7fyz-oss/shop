<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign  in</title>
    <link rel="stylesheet" href="signin.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="display">
        <div class="logo"></div>
        <div class="registerwindow">
            <div class="logo1"></div>
            <p>Sign In</p>
            <a href="index.html" id="cancel">Cancel</a>
            <div class="inputs">
            <label for="name" >Name</label>
            <input type="text" id="name" maxlength="10" required placeholder="Name...">
            </div>
            <div class="inputs">
            <label for="email" >Email</label>
            <input type="email" id="email" required placeholder="Email" >
            </div>
            <div class="inputs">
            <label for="tel" required >tel number</label>
            <input type="tel" id="tel" maxlength="9" required placeholder="Phone Number...">
            </div>

            <div class="gender">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="female">
            </div>
            <div>
                 <a href="help.html">Help</a>
             <button class="submit">Submit</button>
             </div>
            </div>
            
        </div>
    </div>
</body>
</html>
